  background error:
    covariance model: SABER
    linear variable change:
      input variables: &id001
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - geopotential_height_times_gravity_at_surface
      - skin_temperature_at_surface
      linear variable change name: Control2Analysis
      output variables:
      - ua
      - va
      - t
      - ps
      - q
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - frocean
      - frlake
      - frseaice
      - ts
    saber central block:
      read:
        debugging mode: false
        gsi akbk: ./fv3-jedi/fv3files/akbk72.nc4
        gsi berror namelist file: ./fv3-jedi/gsibec/hyb_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
        gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
        processor layout x direction: @JEDI_VAR_GSIXLAYOUT
        processor layout y direction: @JEDI_VAR_GSIYLAYOUT
#     saber block name: gsi covariance
      saber block name: gsi hybrid covariance

    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: latlon
          lats: @JEDI_GSIBEC_NLAT
          lons: @JEDI_GSIBEC_NLON
        custom partitioner matching gsi:
          bands: @JEDI_VAR_GSIYLAYOUT
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator

#   saber outer blocks:
#   - debugging mode: false
#     gsi akbk: ./fv3-jedi/fv3files/akbk72.nc4
#     gsi berror namelist file: ./fv3-jedi/gsibec/hyb_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
#     gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
#     processor layout x direction: @JEDI_VAR_GSIXLAYOUT
#     processor layout y direction: @JEDI_VAR_GSIYLAYOUT
#     saber block name: gsi interpolation to model grid
 
      state variables to inverse: *id001
  cost type: 4D-Ens-Var
  geometry:
    akbk: ./fv3-jedi/fv3files/akbk72.nc4
    field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
    fms initialization:
      field table filename: ./fv3-jedi/fv3files/field_table_gmao
      namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
    layout:
    - @JEDI_VAR_XLAYOUT
    - @JEDI_VAR_YLAYOUT
    npx: @JEDI_BKG_RESOL
    npy: @JEDI_BKG_RESOL
    npz: 72
  jb evaluation: false
# OBSYAML_BEG
# OBSYAML_END
  parallel subwindows: false
  subwindow: PT1H
  time window:
    begin: $JEDI_ISO_DATE_BEG
    bound to include: begin
    length: PT6H
  variable change:
    variable change name: Analysis2Model
final:
  diagnostics:
    departures: oman
  prints:
    frequency: PT1H
output:
  datapath: ./ana
  filename: $EXPID.ana.ceta.%yyyy%mm%dd_%hh%MMz.nc4
  filetype: cube sphere history
  first: PT0H
  frequency: PT1H
  provider: geos
variational:
  iterations:
  - ninner: '50'
    diagnostics:
      departures: ombg
    geometry:
      akbk: ./fv3-jedi/fv3files/akbk72.nc4
      field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
      fms initialization:
        field table filename: ./fv3-jedi/fv3files/field_table_gmao
        namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
      layout:
      - @JEDI_VAR_XLAYOUT
      - @JEDI_VAR_YLAYOUT
      npx: @JEDI_BKG_RESOL
      npy: @JEDI_BKG_RESOL
      npz: 72
    gradient norm reduction: 1e-3
    linear model:
      increment variables:
      - ua
      - va
      - t
      - ps
      - q
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - frocean
      - frlake
      - frseaice
      - ts
      name: Identity
      tstep: PT1H
      variable change: Identity
