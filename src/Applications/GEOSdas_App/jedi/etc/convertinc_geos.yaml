input geometry:
  fms initialization:
    namelist filename: ./fv3files/input_geos_c90.nml
    field table filename: ./fv3files/field_table_gmao
  layout: [2,1]
  akbk: ./fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: $JEDI_BKG_HRES
  npy: $JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  field metadata override: ./fieldmetadata/geos.yaml
output geometry:
  layout: [2,1]
  akbk: ./fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: $JEDI_BKG_HRES
  npy: $JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  field metadata override: ./fieldmetadata/geos.yaml

linear variable change:
  variable change name: Model2GeoVaLs
  input variables: &myvars
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - rain_water
  - snow_water
  - mole_fraction_of_ozone_in_air
  - air_pressure_at_surface
  - skin_temperature_at_surface
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: t
    water_vapor_mixing_ratio_wrt_moist_air: q
    cloud_liquid_ice: qi
    cloud_liquid_water: ql
    rain_water: qr
    snow_water: qs
    mole_fraction_of_ozone_in_air: o3ppmv
    air_pressure_at_surface: ps
    skin_temperature_at_surface: ts
  output variables: *myvars
increments:
- date: "$JEDI_ISO_DATE_ANA"
  input variables: *myvars
  trajectory:
    datetime: "$JEDI_ISO_DATE_ANA"
    state variables: *myvars
    filetype: cube sphere history
    provider: geos
    datapath: ./bkg
    filename: $EXPID.bkg_clcv_rst.${AYYYYMMDD_HH}00z.nc4
  input:
    datetime: "$JEDI_ISO_DATE_ANA"
    filetype: cube sphere history
    provider: geos
    datapath: ./inc
    filename: $EXPID.jedi_inc-iter1.ceta.${AYYYYMMDD_HH}00z.nc4
  output:
   filetype: auxgrid
   gridtype: latlon
   filename: ./inc/$EXPID.jedi_inc1.eta.

