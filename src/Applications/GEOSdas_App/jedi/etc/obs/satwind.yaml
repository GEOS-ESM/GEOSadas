    - obs space:
        name: Satellite Winds
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/satwind.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/satwind.$BYYYYYMMDDTHH0000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - windEastward
        - windNorthward
      obs operator:
        name: VertInterp
        observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
        hofx scaling field: SurfaceWindScalingPressure
        hofx scaling field group: DerivedVariables
      linear obs operator:
        name: VertInterp
        observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
        hofx scaling field: SurfaceWindScalingPressure
        hofx scaling field group: DerivedVariables
      obs prior filters:
      - filter: Variable Transforms
        apply at iterations: 0, 1, 2
        Transform: SurfaceWindScalingPressure
        SkipWhenNoObs: false
      obs post filters:
      - filter: PreQC
        apply at iterations: 0, 1, 2
        maxvalue: 3
        action:
          name: reject
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: windEastward
        where:
        - variable: PreUseFlag/windEastward
          is_in: 100
        action:
          name: reject
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: windNorthward
        where:
        - variable: PreUseFlag/windNorthward
          is_in: 100
        action:
          name: reject
