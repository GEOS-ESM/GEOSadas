    - obs space:
        name: Aircraft Temperature
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/aircraft_temperature.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: warn
          obsgrouping:
            group variables:
            - stationIdentification
            - releaseTime
            sort variable: pressure
            sort order: descending
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/aircraft_temperature.$BYYYYYMMDDTHH0000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - airTemperature
      obs bias:
        input file: ./obs/aircraft_temperature.$PYYYYYMMDDTHH0000Z.acftbias
        output file: ./vbc/aircraft_temperature.$BYYYYYMMDDTHH0000Z.acftbias
        bc by record: true
        variational bc:
          predictors:
          - name: constant
          - name: obsMetadataPredictor
            variable: instantaneousAltitudeRate
          - name: obsMetadataPredictor
            variable: instantaneousAltitudeRate
            order: 2
        covariance:
          minimal required obs number: 3
          variance range:
          - 1e-06
          - 1.0
          step size: 0.0001
          largest analysis variance: 10000.0
          prior:
            input file: ./obs/aircraft_temperature.$PYYYYYMMDDTHH0000Z.acftbias_cov
            inflation:
              ratio: 1.005
              ratio for small dataset: 2.0
      obs operator:
        name: Composite
        components:
        - name: VertInterp
          observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
          variables:
          - airTemperature
      linear obs operator:
        name: Composite
        components:
        - name: VertInterp
          observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
          variables:
          - airTemperature
      obs filters:
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 130
        assignments:
        - name: MetaData/stationIdentification
          value: 'KX130   '
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        where:
        - variable:
            name: MetaData/instantaneousAltitudeRate
          minvalue: 50.0
        assignments:
        - name: MetaData/instantaneousAltitudeRate
          value: 0.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error parameter: 2.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 100000
              - 95000
              - 90000
              - 85000
              - 80000
              errors:
              - 2.5
              - 2.3
              - 2.1
              - 1.9
              - 1.7
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 130
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 100000
              - 95000
              - 90000
              - 85000
              - 80000
              errors:
              - 1.4706
              - 1.3529
              - 1.2353
              - 1.1176
              - 1.0
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 131,133
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 105000
              - 100000
              - 95000
              - 90000
              - 85000
              - 70000
              - 65000
              - 60000
              - 40000
              - 35000
              - 30000
              - 25000
              - 20000
              - 5000
              errors:
              - 1.5
              - 1.3
              - 1.1
              - 0.9
              - 0.8
              - 0.8
              - 0.75
              - 0.7
              - 0.7
              - 0.75
              - 0.85
              - 1.3
              - 1.5
              - 1.5
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 132
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 100000
              - 95000
              - 90000
              - 85000
              - 80000
              - 60000
              - 40000
              errors:
              - 1.5
              - 1.35
              - 1.25
              - 1.1
              - 1.0
              - 1.3
              - 1.7
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 134
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 100000
              - 95000
              - 90000
              - 85000
              - 80000
              errors:
              - 1.4706
              - 1.3529
              - 1.2353
              - 1.1176
              - 1000000000.0
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 135
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorConventional
            options:
              test QCflag: PreQC
              inflate variables:
              - airTemperature
              pressure: MetaData/pressure
              distance threshold: 60000.0
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable: PreQC/airTemperature
          is_in: 4-15
        action:
          name: passivate
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 134, 135
        action:
          name: passivate
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        action:
          name: inflate error
          inflation factor: 10.0
        filter variables:
        - name: airTemperature
        where:
        - variable:
            name: MetaData/pressure
          maxvalue: 110000
          minvalue: 50000
        - variable:
            name: ObsType/airTemperature
          is_in: 130
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function: GsiAdjustObsError/airTemperature
        where:
        - variable:
            name: GsiAdjustObsError/airTemperature
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorPressureCheck
            options:
              variable: airTemperature
              inflation factor: 8.0
              surface_obs: false
              adjusted_error_name: GsiAdjustObsError
              geovar_sfc_geomz: height_above_mean_sea_level_at_surface
        defer to post: true
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        assignments:
        - name: TempObsErrorData/airTemperature
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/airTemperature
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error parameter: 1.3
        where:
        - variable:
            name: TempObsErrorData/airTemperature
          maxvalue: 1.3
        - variable:
            name: TempObsErrorData/airTemperature
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error parameter: 5.6
        where:
        - variable:
            name: TempObsErrorData/airTemperature
          minvalue: 5.6
        - variable:
            name: TempObsErrorData/airTemperature
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable: PreUseFlag/airTemperature
          minvalue: 1
        action:
          name: reject
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        threshold: 7.0
        action:
          name: reject
        where:
        - variable: PreQC/airTemperature
          is_not_in:
          - 3
        defer to post: true
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        threshold: 4.9
        action:
          name: reject
        where:
        - variable: PreQC/airTemperature
          is_in:
          - 3
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function: TempObsErrorData/airTemperature
        where:
        - variable:
            name: TempObsErrorData/airTemperature
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorDuplicateCheck
            options:
              use_air_pressure: true
              variable: airTemperature
        defer to post: true
      observation_name: aircraft_temperature
