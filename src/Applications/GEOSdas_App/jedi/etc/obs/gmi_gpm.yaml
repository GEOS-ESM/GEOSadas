    - obs space:
        name: GMI GPM
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/gmi_gpm.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/gmi_gpm.$BYYYYYMMDDTHH0000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - brightnessTemperature
        channels: 1-13
      obs operator:
        name: CRTM
        Absorbers:
        - H2O
        - O3
        - CO2
        Clouds:
        - Water
        - Ice
        - Rain
        - Snow
        Cloud_Fraction: 1.0
        Cloud_Seeding: true
        obs options:
          Sensor_ID: gmi_gpm
          EndianType: little_endian
          CoefficientPath: $JEDI_CRTM_COEFFS
        linear obs operator:
          Absorbers:
          - H2O
          - O3
          Clouds:
          - Water
          - Ice
          - Rain
          - Snow
          Surfaces:
          - Water_Temperature
          - Land_Temperature
          - Ice_Temperature
          - Snow_Temperature
          zeroO3JacRange:
          - 996.0
          - 1170.0
      obs bias:
        input file: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.satbias.nc4
        output file: ./vbc/gmi_gpm.$BYYYYYMMDDTHH0000Z.satbias.nc4
        variational bc:
          predictors:
          - name: constant
          - name: lapseRate
            order: 2
            tlapse: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: lapseRate
            tlapse: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: emissivityJacobian
          - name: cloudWaterContent
            sensor: GMI_GPM
            ch37v: 6
            ch37h: 7
            order: 2
            tlapse: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: cloudWaterContent
            sensor: GMI_GPM
            ch37v: 6
            ch37h: 7
            tlapse: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 4
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 3
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 2
          - name: sensorScanAngle
            var_name: sensorScanPosition
        covariance:
          minimal required obs number: 20
          variance range:
          - 1e-06
          - 10.0
          step size: 0.0001
          largest analysis variance: 10000.0
          prior:
            input file: ./obs/gmi_gpm.$PYYYYYMMDDTHH0000Z.satbias_cov.nc4
            inflation:
              ratio: 1.1
              ratio for small dataset: 2.0
          output file: ./vbc/gmi_gpm.$BYYYYYMMDDTHH0000Z.satbias_cov.nc4
      obs filters:
      - filter: Bounds Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-9
        minvalue: 50.0
        maxvalue: 320.0
      - filter: Bounds Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 10-13
        minvalue: 70.0
        maxvalue: 320.0
      - filter: Domain Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        where:
        - variable:
            name: MetaData/sensorScanPosition
          minvalue: 5
          maxvalue: 70
        - variable:
            name: MetaData/latitude
          minvalue: -55.0
          maxvalue: 55.0
        - variable:
            name: MetaData/heightOfSurface
          maxvalue: 2000
        - variable:
            name: GeoVaLs/water_area_fraction
          minvalue: 0.99
        - variable:
            name: GeoVaLs/average_surface_temperature_within_field_of_view
          minvalue: 275
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        where:
        - variable:
            name: MetaData/latitude
          minvalue: -20.0
          maxvalue: 0.0
        - variable:
            name: MetaData/longitude
          minvalue: 25.0
          maxvalue: 40.0
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        assignments:
        - name: DerivedMetaData/cloudWaterContent_obs
          type: float
          function:
            name: ObsFunction/CLWRetMW
            options:
              clwret_ch37v: 6
              clwret_ch37h: 7
              clwret_types:
              - ObsValue
      - filter: Bounds Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        test variables:
        - name: ObsFunction/CLWRetMW
          options:
            clwret_ch37v: 6
            clwret_ch37h: 7
            clwret_types:
            - ObsValue
        maxvalue: 900
      - filter: Bounds Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        test variables:
        - name: ObsFunction/CLWRetMW
          options:
            clwret_ch37v: 6
            clwret_ch37h: 7
            clwret_types:
            - HofX
        maxvalue: 900
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        assignments:
        - name: DerivedMetaData/cloudWaterContent_hofx
          type: float
          function:
            name: ObsFunction/CLWRetMW
            options:
              clwret_ch37v: 6
              clwret_ch37h: 7
              clwret_types:
              - HofX
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        where:
        - variable:
            name: ObsFunction/CLWRetMW
            options:
              clwret_ch37v: 6
              clwret_ch37h: 7
              clwret_types:
              - ObsValue
          minvalue: 0.0
          maxvalue: 0.05
        - variable:
            name: ObsFunction/Emissivity_Diff_GMI
            options:
              channel: 2
              regression_constant_1: 0.1329
              regression_constant_2: 0.42468
              regression_coeff_1:
              - -0.00548
              - 0.00772
              - 0.0053
              - -0.00425
              - 0.00053
              - 8e-05
              - -3e-05
              - -0.00144
              - 0.00059
              - -0.00016
              - 3e-05
              - -0.00011
              - 0.00017
              regression_coeff_2:
              - 0.00289
              - -0.00142
          minvalue: 0.01
        action:
          name: reject
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        where:
        - variable:
            name: ObsFunction/CLWRetMW
            options:
              clwret_ch37v: 6
              clwret_ch37h: 7
              clwret_types:
