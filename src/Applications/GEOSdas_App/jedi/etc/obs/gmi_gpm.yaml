          minvalue: 0.05
        action:
          name: reject
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelRamp
            channels: 1-13
            options:
              channels: 1-13
              xvar:
                name: ObsFunction/CLWRetSymmetricMW
                options:
                  clwret_ch37v: 6
