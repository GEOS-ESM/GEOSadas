          minvalue: 0.035
        action:
          name: reject
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-13
        where:
        - variable:
            name: ObsFunction/CLWRetMW
            options:
              clwret_ch37v: 6
              clwret_ch37h: 7
              clwret_types:
              - ObsValue
          minvalue: 0.0
          maxvalue: 0.05
        - variable:
            name: ObsFunction/Emissivity_Diff_GMI
            options:
              channel: 7
              regression_constant_1: 0.30306
              regression_constant_2: 1.24071
              regression_coeff_1:
              - -0.01793
