              - 0.05
              - 0.05
              - 0.05
              x1:
              - 25.0
              - 25.0
              - 25.0
              - 25.0
              - 25.0
              err0:
              - 300.0
              - 300.0
              - 2.5
              - 2.0
              - 2.0
              err1:
              - 700.0
              - 700.0
              - 30.0
              - 50.0
              - 60.0
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-5
        where:
        - variable:
            name: GeoVaLs/water_area_fraction
