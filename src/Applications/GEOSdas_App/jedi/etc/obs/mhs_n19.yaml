              channels: 1-5
              options:
                channels: 1-5
            obserr_bound_topo:
              name: ObsFunction/ObsErrorFactorTopoRad
              channels: 1-5
              options:
                channels: 1-5
                sensor: mhs_n19
            obserr_function:
