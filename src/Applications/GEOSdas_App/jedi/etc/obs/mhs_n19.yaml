      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-5
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorTopoRad
            channels: 1-5
            options:
              sensor: mhs_n19
              channels: 1-5
      - filter: BlackList
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-5
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorTransmitTopRad
            channels: 1-5
            options:
              channels: 1-5
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: brightnessTemperature
          channels: 1-5
        where:
