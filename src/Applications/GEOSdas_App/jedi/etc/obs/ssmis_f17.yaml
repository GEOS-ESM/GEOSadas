        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/ssmis_f17.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/ssmis_f17.$BYYYYYMMDDTHH0000Z.nc4
        simulated variables:
        - brightnessTemperature
        channels: 1-24
      io pool:
        max pool size: 6
      obs operator:
        name: CRTM
        Absorbers:
        - H2O
        - O3
        - CO2
        linear obs operator:
          Absorbers:
          - H2O
          - O3
          Surfaces:
          - Water_Temperature
          - Land_Temperature
          - Ice_Temperature
          - Snow_Temperature
          zeroO3JacRange:
          - 996.0
          - 1170.0
        obs options:
          Sensor_ID: ssmis_f17
          EndianType: little_endian
          CoefficientPath: $JEDI_CRTM_COEFFS
      obs bias:
        input file: ./obs/ssmis_f17.$PYYYYYMMDDTHH0000Z.satbias.nc4
        output file: ./vbc/ssmis_f17.$BYYYYYMMDDTHH0000Z.satbias.nc4
        variational bc:
          predictors:
          - name: constant
          - name: lapseRate
            order: 2
            tlapse: ./obs/ssmis_f17.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: lapseRate
            tlapse: ./obs/ssmis_f17.$PYYYYYMMDDTHH0000Z.tlapse.txt
          - name: cosineOfLatitudeTimesOrbitNode
          - name: sineOfLatitude
          - name: emissivityJacobian
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 4
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 3
          - name: sensorScanAngle
            var_name: sensorScanPosition
            order: 2
          - name: sensorScanAngle
            var_name: sensorScanPosition
        covariance:
          minimal required obs number: 20
          variance range:
          - 1e-06
          - 10.0
          step size: 0.0001
          largest analysis variance: 10000.0
          prior:
            input file: ./obs/ssmis_f17.$PYYYYYMMDDTHH0000Z.satbias_cov.nc4
            inflation:
              ratio: 1.1
              ratio for small dataset: 2.0
          output file: ./vbc/ssmis_f17.$BYYYYYMMDDTHH0000Z.satbias_cov.nc4
