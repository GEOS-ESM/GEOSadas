    - obs space:
        name: Radiosondes
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/sondes.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: error
          obsgrouping:
            group variables:
            - stationIdentification
            - releaseTime
            sort variable: pressure
            sort order: descending
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/sondes.$BYYYYYMMDDTHH0000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - windEastward
        - windNorthward
        - virtualTemperature
        - airTemperature
        - specificHumidity
        - stationPressure
      obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          hofx scaling field: SurfaceWindScalingPressure
          hofx scaling field group: DerivedVariables
        - name: VertInterp
          variables:
          - name: airTemperature
          - name: virtualTemperature
          - name: specificHumidity
        - name: SfcCorrected
          variables:
          - name: stationPressure
          correction scheme to use: GSL
          geovar_geomz: geopotential_height
          geovar_sfc_geomz: height_above_mean_sea_level_at_surface
          station_altitude: height
      linear obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          hofx scaling field: SurfaceWindScalingPressure
          hofx scaling field group: DerivedVariables
        - name: VertInterp
          variables:
          - name: airTemperature
          - name: virtualTemperature
          - name: specificHumidity
        - name: Identity
          variables:
          - name: stationPressure
      obs prior filters:
      - filter: Variable Transforms
        apply at iterations: 0, 1, 2
        Transform: SurfaceWindScalingPressure
        SkipWhenNoObs: false
      obs post filters:
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        where:
        - variable: PreUseFlag/stationPressure
          minvalue: 1
        action:
          name: reject
      - filter: RejectList
        apply at iterations: 0, 1, 2
        where:
        - variable:
            name: PreQC/stationPressure
          is_in: 4-15
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 60000
              - 55000
              errors:
              - 100
              - 100000000000.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: PreQC/stationPressure
          is_in:
          - 3
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorSfcPressure
            options:
              geovar_geomz: geopotential_height
              geovar_sfc_geomz: height_above_mean_sea_level_at_surface
              station_altitude: height
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        assignments:
        - name: TempObsErrorData/stationPressure
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/stationPressure
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error parameter: 100
        where:
        - variable:
            name: TempObsErrorData/stationPressure
          maxvalue: 100
        - variable:
            name: TempObsErrorData/stationPressure
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error parameter: 300
        where:
        - variable:
            name: TempObsErrorData/stationPressure
          minvalue: 300
        - variable:
            name: TempObsErrorData/stationPressure
          value: is_valid
        defer to post: true
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        threshold: 4.0
        action:
          name: reject
        where:
        - variable: PreQC/stationPressure
          is_not_in:
          - 3
        defer to post: true
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        threshold: 2.8
        action:
          name: reject
        where:
        - variable: PreQC/stationPressure
          is_in:
          - 3
        defer to post: true
      - filter: Perform Action
