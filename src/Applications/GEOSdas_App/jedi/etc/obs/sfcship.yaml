    - obs space:
        name: Surface Marine Stations
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/sfcship.$BYYYYYMMDDTHH0000Z.nc4
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ./hofx/sfcship.$BYYYYYMMDDTHH0000Z.nc4
        io pool:
          max pool size: 6
        simulated variables:
        - windEastward
        - windNorthward
        - virtualTemperature
        - airTemperature
        - specificHumidity
        - stationPressure
      obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          vertical coordinate: geopotential_height
          observation vertical coordinate group: DerivedVariables
          observation vertical coordinate: adjustedHeight
          interpolation method: linear
#         hofx scaling field: SurfaceWindScalingHeight
#         hofx scaling field group: DerivedVariables
        - name: VertInterp
          observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
          variables:
          - name: airTemperature
          - name: virtualTemperature
        - name: SfcCorrected
          variables:
          - name: stationPressure
          correction scheme to use: GSL
          geovar_geomz: geopotential_height
          geovar_sfc_geomz: height_above_mean_sea_level_at_surface
          station_altitude: height
        - name: Identity
          variables:
          - name: specificHumidity
      linear obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          vertical coordinate: geopotential_height
          observation vertical coordinate group: DerivedVariables
          observation vertical coordinate: adjustedHeight
          interpolation method: linear
#         hofx scaling field: SurfaceWindScalingHeight
#         hofx scaling field group: DerivedVariables
        - name: VertInterp
          observation alias file: $FVHOME/run/jedi/Config/obsop_name_map.yaml
          variables:
          - name: airTemperature
          - name: virtualTemperature
        - name: Identity
          variables:
          - name: stationPressure
          - name: specificHumidity
      obs prior filters:
      - filter: Variable Transforms
#       apply at iterations: 0, 1, 2
        Transform: AdjustedHeightCoordinate
        SkipWhenNoObs: false
#     - filter: Variable Transforms
#       apply at iterations: 0, 1, 2
#       Transform: SurfaceWindScalingHeight
#       SkipWhenNoObs: false
      obs post filters:
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        where:
        - variable: PreUseFlag/stationPressure
          minvalue: 1
        action:
          name: reject
      - filter: RejectList
        apply at iterations: 0, 1, 2
        where:
        - variable:
            name: PreQC/stationPressure
          is_in: 4-15
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 180
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 80000
              - 75000
              - 70000
              - 65000
              - 60000
              - 55000
              errors:
              - 100
              - 100
              - 110
              - 120
              - 120
              - 100000000000.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 183
        action:
          name: assign error
          error parameter: 100000000000.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        action:
          name: inflate error
          inflation factor: 0.7
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 180
        - variable: ObsSubType/stationPressure
          is_in:
          - 0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: PreQC/stationPressure
          is_in:
          - 3
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorSfcPressure
            options:
              geovar_geomz: geopotential_height
              geovar_sfc_geomz: height_above_mean_sea_level_at_surface
              station_altitude: height
      - filter: Variable Assignment
        apply at iterations: 0, 1, 2
        assignments:
        - name: TempObsErrorData/stationPressure
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/stationPressure
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error parameter: 100
        where:
        - variable:
            name: TempObsErrorData/stationPressure
          maxvalue: 100
        - variable:
            name: TempObsErrorData/stationPressure
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error parameter: 300
        where:
        - variable:
            name: TempObsErrorData/stationPressure
          minvalue: 300
        - variable:
            name: TempObsErrorData/stationPressure
          value: is_valid
        defer to post: true
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        threshold: 4.0
        action:
          name: reject
        where:
        - variable: PreQC/stationPressure
          is_not_in:
          - 3
        - variable: ObsType/stationPressure
          is_in: 180,183
        defer to post: true
      - filter: Background Check
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        threshold: 2.8
        action:
          name: reject
        where:
        - variable: PreQC/stationPressure
          is_in:
          - 3
        - variable: ObsType/stationPressure
          is_in: 180,183
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: assign error
          error function: TempObsErrorData/stationPressure
        where:
        - variable:
            name: TempObsErrorData/stationPressure
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorDuplicateCheck
            options:
              use_air_pressure: false
              variable: stationPressure
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in:
          - 183
        action:
          name: assign error
          error parameter: 100000000000.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in:
          - 183
        action:
          name: reject
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in:
          - 180
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals:
              - 80000
              - 75000
              - 70000
              - 65000
              errors:
              - 1.75
              - 1.95
              - 2.25
              - 1.0
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorConventional
            options:
              test QCflag: PreQC
              test QCthreshold: 3
              inflate variables:
              - airTemperature
              pressure: MetaData/pressure
              distance threshold: -1.0
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: PreQC/airTemperature
          is_in:
          - 3 7
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: MetaData/pressure
          minvalue: 0
          maxvalue: 9999
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function: GsiAdjustObsError/airTemperature
        where:
        - variable:
            name: GsiAdjustObsError/airTemperature
          value: is_valid
        defer to post: true
      - filter: Perform Action
        apply at iterations: 0, 1, 2
