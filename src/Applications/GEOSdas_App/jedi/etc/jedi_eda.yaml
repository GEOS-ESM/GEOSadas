# What is the experiment id?
experiment_id: ${EXPID}-eda_atmos

# What is the experiment root (the directory where the experiment will be stored)?
experiment_root: $JEDIWORK

# What is the time of the first cycle (middle of the window)?
start_cycle_point: '$JEDI_ISO_DATE_ANA'

# What is the time of the final cycle (middle of the window)?
final_cycle_point: '$JEDI_ISO_DATE_ANA'

# List of models in this experiment
model_components:
- geos_atmosphere

# Set the Cylc runahead limit: the maximum number of cycles that may be active ahead of the current cycle (e.g. P1: up to 1 cycle ahead, P3: up to 3 cycles ahead, default P4).
runahead_limit: P2

# What experiment_id should r2d2 reference for experiment?
r2d2_experiment_id: ${EXPID}-eda_atmos-2ccaa7cf

# Server/profile name in ~/.swell/r2d2_credentials.yaml (e.g. 'gmao_server'). Leave empty if credentials are at the root level.
r2d2_server:

# Datastore name passed to R2D2 fetch and store operations (e.g. a Discover directory store or an S3 bucket store). Run scripts/discover_r2d2_datastores.py to list available datastores. Leave empty to let R2D2 pick the highest-priority writable datastore for your compute host.
r2d2_datastore:

# Skip registering and storing results of this experiment in R2D2?
skip_r2d2: false

# Record of the suite being executed
suite_to_run: eda_atmos

# Dry-run option for comparing configs.
mock_experiment: false

# Do you want to use an existing JEDI build or create a new build?
jedi_build_method: use_existing

# What is the path to the existing JEDI build directory?
existing_jedi_build_directory: $JEDI_ROOT/

# What is the path to the existing JEDI source code directory?
existing_jedi_source_directory: $JEDI_ROOT/../

# Configurations for the model components.
models:

  # Configuration for the geos_atmosphere model component.
  geos_atmosphere:

    # Enter the cycle times for this model.
    cycle_times:
    - T00
    - T06
    - T12
    - T18

    # Do you want to use cycling VarBC option?
    cycling_varbc: false

    # What is the duration for the data assimilation window?
    window_length: PT6H

    # Do you want to use a 3D or 4D (including FGAT) window?
    window_type: 3D

    # What is the name of the name of the experiment providing the backgrounds?
    background_experiment: ${EXPID}

    # What is the horizontal resolution for the forecast model and backgrounds?
    horizontal_resolution: '91'

    # How long before the middle of the analysis window did the background providing forecast begin?
    background_time_offset: PT9H

    # What is the path to the GEOS X-backgrounds directory?
    geos_x_background_directory: ${JEDIWORK}/archive/

    # Perform check for observations? Set to false for debugging purposes.
    check_for_obs: true

    # What is the path to the CRTM coefficient files?
    crtm_coeff_dir: $JEDI_CRTM_COEFFS

    # What is the path to the Swell formatted observing system records?
    observing_system_records_path: None

    # Which observations do you want to include?
    observations:
    - aircraft_temperature
    - aircraft_wind
    - amsr2_gcom-w1
    - amsua_aqua
    - amsua_metop-b
    - amsua_metop-c
    - amsua_n15
    - amsua_n18
    - amsua_n19
    - atms_n20
    - atms_npp
    - avhrr3_metop-b
    - avhrr3_n18
    - avhrr3_n19
    - gmi_gpm
    - gps
    - mhs_metop-b
    - mhs_metop-c
    - mhs_n19
    - mls55_aura
    - omi_aura
    - ompsnm_npp
    - pibal
    - satwind
    - scatwind
    - sfcship
    - sfc
    - sondes
    - ssmis_f17
# cannnot properly perturb obs for chan-correlated data
#   - airs_aqua
#   - cris-fsr_n20
#   - cris-fsr_npp
#   - iasi_metop-b
#   - iasi_metop-c

    # What number of processors do you wish to use in the x-direction?
    npx_proc: 4

    # What number of processors do you wish to use in the y-direction?
    npy_proc: 5

    # What is the vertical resolution for the forecast model and background?
    vertical_resolution: '72'

    # What is the rejection fraction for obs thinning?
    obs_thinning_rej_fraction: 0.8

    # Provide the log naming convention (e.g. 'variational', 'fgat').
    comparison_log_type: ensmeanvariance

    # What are the analysis variables?
    analysis_variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    - air_pressure_levels
    - cloud_liquid_ice
    - cloud_liquid_water
    - rain_water
    - snow_water
    - mole_fraction_of_ozone_in_air
    - geopotential_at_surface
    - fraction_of_ocean
    - fraction_of_lake
    - fraction_of_ice
    - skin_temperature_at_surface

    # What value of gradient norm reduction for convergence?
    gradient_norm_reduction: 0.001

    # Which GSIBEC climatological or hybrid?
    gsibec_configuration: cli_gsibec_configuration

    # Which data assimilation minimizer do you wish to use?
    minimizer: DRPCG

    # How many number of latutides in GSIBEC grid?
    gsibec_nlats: '91'

    # How many number of longitudes in GSIBEC grid?
    gsibec_nlons: '144'

    # What number of iterations do you wish to use for each outer loop? Provide a list of integers the same length as the number of outer loops.
    number_of_iterations:
    - 50

    # How many members comprise the ensemble?
    ensemble_num_members: 32

    # What is the path to the Swell Static files directory?
    swell_static_files: $JEDI_STATIC_FILES

    # Enter obs perturbation amplitude for EDA:
    obs_pert_amplitude: 0.5

    # What is the number of processors per host?
    perhost:

    # How long before the middle of the analysis window did the ensemble background providing forecast begin?
    ebkg_time_offset: PT3H

    # What is the path to the GEOS X-backgrounds directory?
    geos_x_ensemble_directory: ${JEDIWORK}/archive

    # What is the database providing the observations?
    obs_experiment: ${EXPID}

    # Map observation names to their R2D2 providers.
    observation_providers: {}

    # Provide a list of patterns that you wish to remove from the cycle directory.
    clean_patterns: []

    # What is the path to the GSI formatted observing system records?
    observing_system_records_mksi_path: $FVROOT/etc/

    # What is the GSI formatted observing system records tag?
    observing_system_records_mksi_path_tag: v5.44.1

    # Configure the diffstates specifications: [state1, state2]
    diffstates_spec:
      state1:
        fn_input: geos.prior.mean.ceta.%yyyy%mm%dd_%hh%MM%ssz.nc4
      state2:
        fn_input: analysis/mean/eda_atmos.ana.ceta.%yyyy%mm%dd_%hh%MM%ssz.nc4
      state_diff:
        fn_output: analysis/mean/eda_atmos.inc_iter1
        grid_type:
        - cs
        - latlon
      state_type: ensemble

    # Provide a path that contains observation files not in r2d2.
    ioda_locations_not_in_r2d2: $JEDIWORK/obs

    # Configure the ensemble mean and variance specifications:
    ensmeanvariance_spec:
    - state: bkg
      fn_input: ebkg/mem%mem%/geos.mem%mem%.%yyyy%mm%dd_%hh%MM%ssz.nc4
      fn_output_mean: geos.prior.mean
      fn_output_variance: geos.prior.variance
      grid_type:
      - cs
      - latlon
    - state: analysis
      fn_input: analysis/mem%mem%/eda_atmos.ana.ceta.%yyyy%mm%dd_%hh%MM%ssz.nc4
      fn_output_mean: analysis/mean/eda_atmos.ana
      fn_output_variance: analysis/variance/eda_atmos.ana
      grid_type:
      - cs
      - latlon

# Generate JEDI executable YAML and exit?
generate_yaml_and_exit: false

# What is the path to the user provided Swell Static Files directory?
swell_static_files_user: None

# Use cached observation files if they already exist?
cache_fetch: true

# Fetch observations directly from a public S3 bucket if they are available?
fetch_obs_from_public_s3: false

# Datetime this file was created (auto added)
datetime_created: 20261006_115816Z

# Computing platform to run the experiment
platform: nccs_discover_sles15
