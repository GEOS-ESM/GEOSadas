state geometry:
  fms initialization:
    namelist filename: fv3-jedi/fv3files/fmsmpp.nml
    field table filename: fv3-jedi/fv3files/field_table_gmao
  akbk: fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: @JEDI_BKG_HRES
  npy: @JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  layout:
  - @JEDI_DIF_XLAYOUT
  - @JEDI_DIF_YLAYOUT
increment geometry:
  akbk: fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: @JEDI_BKG_HRES
  npy: @JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  layout:
  - @JEDI_DIF_XLAYOUT
  - @JEDI_DIF_YLAYOUT
state1:
  datetime: $ISO_STATES_DATE
  filetype: cube sphere history
  provider: geos
  compute edge pressure from surface pressure: true
  max allowable geometry difference: 1e-3
  datapath: ./ana
  filename: $JEDI_CUBED_ANA
  state variables: &statevars
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - rain_water
  - snow_water
  - mole_fraction_of_ozone_in_air
  - geopotential_at_surface
  - air_pressure_levels
  - air_pressure_at_surface
  - fraction_of_ocean
  - fraction_of_lake
  - fraction_of_ice
  - skin_temperature_at_surface
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: t
    water_vapor_mixing_ratio_wrt_moist_air: q
    cloud_liquid_ice: qi
    cloud_liquid_water: ql
    rain_water: qr
    snow_water: qs
    mole_fraction_of_ozone_in_air: o3ppmv
    geopotential_at_surface: phis
    air_pressure_levels: pe
    air_pressure_at_surface: ps
    fraction_of_ocean: frocean
    fraction_of_lake: frlake
    fraction_of_ice: frseaice
    skin_temperature_at_surface: ts
state2:
  datetime: $ISO_STATES_DATE
  filetype: cube sphere history
  provider: geos
  compute edge pressure from surface pressure: true
  max allowable geometry difference: 1e-3
  datapath: ./bkg
  filename: $JEDI_CUBED_BKG
  state variables: *statevars
  field io names: *field_io_names
output:
  filetype: auxgrid
  gridtype: latlon
  datapath: ./inc
  filename: $EXPID.jedi_inc1.eta.
  field io names: *field_io_names
