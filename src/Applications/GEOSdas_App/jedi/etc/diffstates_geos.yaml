state geometry:
  fms initialization:
    namelist filename: fv3-jedi/fv3files/fmsmpp.nml
    field table filename: fv3-jedi/fv3files/field_table_gmao
  akbk: fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: @JEDI_BKG_HRES
  npy: @JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  field metadata override: fv3-jedi/fieldmetadata/geos.yaml
  layout:
  - 4
  - 2
increment geometry:
  akbk: fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
  npx: @JEDI_BKG_HRES
  npy: @JEDI_BKG_HRES
  npz: @JEDI_BKG_VRES
  field metadata override: fv3-jedi/fieldmetadata/geos.yaml
  layout:
  - 4
  - 2
state1:
  datetime: $ISO_STATES_DATE
  filetype: cube sphere history
  provider: geos
  datapath: ./ana
  filename: $JEDI_CUBED_ANA
  state variables:
  - ua
  - va
  - t
  - q
  - qi
  - ql
  - qr
  - qs
  - o3ppmv
  - ps
  - phis
  - ts
# - delp
state2:
  datetime: $ISO_STATES_DATE
  filetype: cube sphere history
  provider: geos
  datapath: ./bkg
  filename: $JEDI_CUBED_BKG
  state variables:
  - ua
  - va
  - t
  - q
  - qi
  - ql
  - qr
  - qs
  - o3ppmv
  - ps
  - phis
  - ts
# - delp
output:
  filetype: auxgrid
  gridtype: latlon
  datapath: ./inc
  filename: $EXPID.jedi_inc1.eta.
