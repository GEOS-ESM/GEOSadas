cost function:
  analysis variables: &anavars
  - ua
  - va
  - t
  - ps
  - q
  - qi
  - ql
  - qr
  - qs
  - o3ppmv
  - phis
  - frocean
  - frlake
  - frseaice
  - ts
  background:
    states:
    - datapath: './'
      datetime: $JEDI_ISO_DATE_ANA
      filenames:
      - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
      - fv3-jedi/bkg/geos.crtmsrf.@JEDI_BKG_RESOL.nc4
      filetype: cube sphere history
      provider: geos
      state variables:
      - ua
      - va
      - t
      - delp
      - ps
      - q
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - qls
      - qcn
      - cfcn
      - frocean
      - frland
      - varflt
      - ustar
      - bstar
      - zpbl
      - cm
      - ct
      - cq
      - kcbl
      - tsm
      - khl
      - khu
      - frlake
      - frseaice
      - vtype
      - stype
      - vfrac
      - sheleg
      - ts
      - soilt
      - soilm
      - u10m
      - v10m
  background error:
    covariance model: hybrid
    components:
    - covariance:
        covariance model: SABER
        linear variable change:
          input variables: &id001
          - eastward_wind
          - northward_wind
          - air_temperature
          - air_pressure_at_surface
          - water_vapor_mixing_ratio_wrt_moist_air
          - cloud_liquid_ice
          - cloud_liquid_water
          - rain_water
          - snow_water
          - mole_fraction_of_ozone_in_air
          - fraction_of_ocean
          - fraction_of_lake
          - fraction_of_ice
          - geopotential_height_times_gravity_at_surface
          - skin_temperature_at_surface
          linear variable change name: Control2Analysis
          output variables: *anavars
        saber central block:
          read:
            debugging mode: false
            gsi akbk: ./fv3-jedi/fv3files/akbk72.nc4
            gsi berror namelist file: ./fv3-jedi/gsibec/cli_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
            gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
            processor layout x direction: @JEDI_VAR_GSIXLAYOUT 
            processor layout y direction: @JEDI_VAR_GSIYLAYOUT
#         saber block name: gsi covariance
          saber block name: gsi static covariance
        saber outer blocks:
        - debugging mode: false
          gsi akbk: ./fv3-jedi/fv3files/akbk72.nc4
          gsi berror namelist file: ./fv3-jedi/gsibec/cli_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
          gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
          processor layout x direction: @JEDI_VAR_GSIXLAYOUT
          processor layout y direction: @JEDI_VAR_GSIYLAYOUT
          saber block name: gsi interpolation to model grid
          state variables to inverse: *id001
      weight:
##     datetime: 2020-12-15T00:00:00Z
##     filetype: cube sphere history
##     provider: geos
##     filename: Data/inputs/geos_c90/clim6.nc4
        value: 0.50

    - covariance:
        covariance model: ensemble
        members from template:
          template:
            states:
            - datetime: $JEDI_ISO_DATE_ANA
              filetype: cube sphere history
              provider: geos
              state variables: *id001
              datapath: ./
              filenames: [mem%mem%/geos.bkg_clcv.%yyyy%mm%dd_%hh%MMz.nc4, fv3-jedi/bkg/geos.crtmsrf.@JEDI_BKGCOV_RESOL.nc4]
          pattern: '%mem%'
          nmembers: 32
          zero padding: 3
        localization:
          localization method: SABER
          saber central block:
            saber block name: BUMP_NICAS
            active variables: *id001
            read:
              general:
                universe length-scale: 2500.0e3
              drivers:
                multivariate strategy: duplicated
                compute nicas: true
              model:
                level for 2d variables: last
              nicas:
                resolution: 6
                explicit length-scales: true
                horizontal length-scale:
