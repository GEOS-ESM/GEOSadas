cost function:
  cost type: 3D-Var
  geometry:
    akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
    fms initialization:
      field table filename: ./fv3-jedi/fv3files/field_table_gmao
      namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
    layout:
    - @JEDI_VAR_XLAYOUT
    - @JEDI_VAR_YLAYOUT
    npx: @JEDI_BKG_HRES
    npy: @JEDI_BKG_HRES
    npz: @JEDI_BKG_VRES
  jb evaluation: false
  analysis variables: &anavars
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - air_pressure_at_surface
  - cloud_liquid_ice
  - cloud_liquid_water
  - rain_water
  - snow_water
  - mole_fraction_of_ozone_in_air
  - geopotential_height_times_gravity_at_surface
  - fraction_of_ocean
  - fraction_of_lake
  - fraction_of_ice
  - skin_temperature_at_surface
  background:
    datetime: $JEDI_ISO_DATE_ANA
    datapath: './'
    filenames:
    - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    - fv3-jedi/bkg/geos.crtmsrf.@JEDI_BKG_HRES.nc4
    filetype: cube sphere history
    provider: geos
    compute edge pressure from surface pressure: true
    max allowable geometry difference: 1e-3
    state variables: &statevars
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_levels
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - rain_water
    - snow_water
    - mole_fraction_of_ozone_in_air
    - geopotential_height_times_gravity_at_surface
    - initial_mass_fraction_of_large_scale_cloud_condensate
    - initial_mass_fraction_of_convective_cloud_condensate
    - convective_cloud_area_fraction
    - fraction_of_ocean
    - fraction_of_land
    - isotropic_variance_of_filtered_topography
    - surface_velocity_scale
    - surface_buoyancy_scale
    - planetary_boundary_layer_height
    - surface_exchange_coefficient_for_momentum
    - surface_exchange_coefficient_for_heat
    - surface_exchange_coefficient_for_moisture
    - KCBL_before_moist
    - surface_temp_before_moist
    - lower_index_where_Kh_greater_than_2
    - upper_index_where_Kh_greater_than_2
    - fraction_of_lake
    - fraction_of_ice
    - vtype
    - stype
    - vfrac
    - sheleg
    - skin_temperature_at_surface
    - soilt
    - soilm
    - eastward_wind_at_surface
    - northward_wind_at_surface
    - sea_surface_temperature
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: t
      water_vapor_mixing_ratio_wrt_moist_air: q
      cloud_liquid_ice: qi
      cloud_liquid_water: ql
      rain_water: qr
      snow_water: qs
      mole_fraction_of_ozone_in_air: o3ppmv
      geopotential_height_times_gravity_at_surface: phis
      initial_mass_fraction_of_large_scale_cloud_condensate: qls
      initial_mass_fraction_of_convective_cloud_condensate: qcn
      convective_cloud_area_fraction: cfcn
      fraction_of_ocean: frocean
      fraction_of_land: frland
      isotropic_variance_of_filtered_topography: varflt
      surface_velocity_scale: ustar
      surface_buoyancy_scale: bstar
      planetary_boundary_layer_height: zpbl
      surface_exchange_coefficient_for_momentum: cm
      surface_exchange_coefficient_for_heat: ct
      surface_exchange_coefficient_for_moisture: cq
      KCBL_before_moist: kcbl
      surface_temp_before_moist: tsm
      lower_index_where_Kh_greater_than_2: khl
      upper_index_where_Kh_greater_than_2: khu
      fraction_of_lake: frlake
      fraction_of_ice: frseaice
      skin_temperature_at_surface: ts
      eastward_wind_at_surface: u10m
      northward_wind_at_surface: v10m
      air_pressure_levels: pe
      air_pressure_at_surface: ps
      sea_surface_temperature: ts_found
  background error:
    covariance model: hybrid
    components:
    - covariance:
        covariance model: SABER
        saber central block:
          saber block name: gsi static covariance
          read:
            debugging mode: false
            gsi akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
            gsi berror namelist file: ./fv3-jedi/gsibec/gsibec_configuration_l@JEDI_BKG_VRESx@JEDI_GSIBEC_NLONy@JEDI_GSIBEC_NLAT.nml
            gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_l@JEDI_BKG_VRESx@JEDI_GSIBEC_NLONy@JEDI_GSIBEC_NLAT.nc4
            processor layout x direction: @JEDI_VAR_GSIXLAYOUT 
            processor layout y direction: @JEDI_VAR_GSIYLAYOUT

        saber outer blocks:
        - saber block name: interpolation
          inner geometry:
            function space: StructuredColumns
            custom grid matching gsi:
              type: latlon
              lats: @JEDI_GSIBEC_NLAT
              lons: @JEDI_GSIBEC_NLON
            custom partitioner matching gsi:
              bands: @JEDI_VAR_GSIYLAYOUT
            halo: 1
          forward interpolator:
            local interpolator type: oops unstructured grid interpolator
          inverse interpolator:
            local interpolator type: oops unstructured grid interpolator

          state variables to inverse: *anavars
        linear variable change:
          input variables: *anavars
          linear variable change name: Control2Analysis
          output variables: *anavars
      weight:
        datetime: $JEDI_ISO_DATE_ANA
        filetype: cube sphere history
        provider: geos
        max allowable geometry difference: 1e-3
        filename: betac.%yyyy%mm%ddT%hh%MM%ssZ.nc4
        field io names: *field_io_names
##      value: 0.50

    - covariance:
        covariance model: ensemble
        members from template:
          template:
            datetime: $JEDI_ISO_DATE_ANA
            filetype: cube sphere history
            provider: geos
            max allowable geometry difference: 1e-3
            state variables: *anavars
            field io names: *field_io_names
            datapath: ./
            filename: mem%mem%/geos.bkg_clcv.%yyyy%mm%dd_%hh%MMz.nc4
          pattern: '%mem%'
          nmembers: 32
          zero padding: 3
        localization:
          localization method: SABER
          saber central block:
            saber block name: BUMP_NICAS
            active variables: *anavars
            read:
              general:
                universe length-scale: 2500.0e3
              drivers:
                multivariate strategy: duplicated
                compute nicas: true
              model:
                level for 2d variables: last
              nicas:
                resolution: 6
                explicit length-scales: true
                horizontal length-scale:
                - groups:
                  - common
                  profile:
                  - 3350515.0   
                  - 3350515.0   
