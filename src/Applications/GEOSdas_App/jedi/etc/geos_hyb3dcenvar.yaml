  cost type: 3D-Var
  geometry:
    akbk: ./fv3-jedi/fv3files/akbk72.nc4
    field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
    fms initialization:
      field table filename: ./fv3-jedi/fv3files/field_table_gmao
      namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
    layout:
    - @JEDI_VAR_XLAYOUT
    - @JEDI_VAR_YLAYOUT
    npx: @JEDI_BKG_RESOL
    npy: @JEDI_BKG_RESOL
    npz: 72
  jb evaluation: false
# OBSYAML_BEG
# OBSYAML_END
  time window:
    begin: $JEDI_ISO_DATE_BEG
    end: $JEDI_ISO_DATE_END
    bound to include: begin
  variable change:
    variable change name: Analysis2Model
final:
  diagnostics:
    departures: oman
  prints:
    frequency: PT3H
output:
  datapath: ./ana
  filename: $EXPID.ana.ceta.%yyyy%mm%dd_%hh%MMz.nc4
  filetype: cube sphere history
  first: PT0H
  frequency: PT1H
  provider: geos
variational:
  iterations:
  - ninner: '100'
    diagnostics:
      departures: ombg
    geometry:
      akbk: ./fv3-jedi/fv3files/akbk72.nc4
      field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
      fms initialization:
        field table filename: ./fv3-jedi/fv3files/field_table_gmao
        namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
      layout:
      - @JEDI_VAR_XLAYOUT
      - @JEDI_VAR_YLAYOUT
      npx: @JEDI_BKG_RESOL
      npy: @JEDI_BKG_RESOL
      npz: 72
    gradient norm reduction: 1e-3
    linear model:
      increment variables:
      - ua
      - va
      - t
      - ps
      - q
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - frocean
      - frlake
      - frseaice
      - ts
      name: Identity
      tstep: PT1H
      variable change: Identity
    online diagnostics:
      increment:
        state component:
          states:
          - date: $JEDI_ISO_DATE_ANA
            datapath: ./
            filename: $EXPID.jedi_inc1.eta.
            filetype: auxgrid
            gridtype: latlon
      write increment: true
