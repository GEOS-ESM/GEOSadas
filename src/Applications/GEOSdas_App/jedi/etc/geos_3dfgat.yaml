cost function:
  cost type: 3D-FGAT
  jb evaluation: false
  time window:
    begin: $JEDI_ISO_DATE_BEG
    length: PT6H
    bound to include: begin
  geometry:
    fms initialization:
      namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
      field table filename: ./fv3-jedi/fv3files/field_table_gmao
    akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
    layout:
    - @JEDI_VAR_XLAYOUT
    - @JEDI_VAR_YLAYOUT
    npx: @JEDI_BKG_HRES
    npy: @JEDI_BKG_HRES
    npz: @JEDI_BKG_VRES
    field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
  model:
    name: PSEUDO
    tstep: PT3H
    filetype: cube sphere history
    provider: geos
    datapath: ./
    filenames:
    - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    - fv3-jedi/bkg/geos.crtmsrf.@JEDI_BKG_HRES.nc4
  variable change:
    variable change name: Analysis2Model
# forecast length: PT6H
  analysis variables:
  - ua
  - va
  - t
  - q
  - ps
  - qi
  - ql
  - qr
  - qs
  - o3ppmv
  - phis
  - frocean
  - frlake
  - frseaice
  - ts
  background:
    datetime: $JEDI_ISO_DATE_BEG
    filetype: cube sphere history
    provider: geos
    datapath: ./
    filenames:
    - bkg.%yyyy%mm%ddT%hh%MM%ssZ.nc4
    - fv3-jedi/bkg/geos.crtmsrf.@JEDI_BKG_HRES.nc4
    state variables:
    - ua
    - va
    - t
    - delp
    - ps
    - q
    - qi
    - ql
    - qr
    - qs
    - o3ppmv
    - phis
    - qls
    - qcn
    - cfcn
    - frocean
    - frland
    - varflt
    - ustar
    - bstar
    - zpbl
    - cm
    - ct
    - cq
    - kcbl
    - tsm
    - khl
    - khu
    - frlake
    - frseaice
    - vtype
    - stype
    - vfrac
    - sheleg
    - ts
    - soilt
    - soilm
    - u10m
    - v10m
  background error:
    covariance model: SABER
#   adjoint test: true
    saber central block:
      saber block name: gsi hybrid covariance
      read:
        gsi akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
        gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
        gsi berror namelist file: ./fv3-jedi/gsibec/cli_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
        processor layout x direction: @JEDI_VAR_GSIXLAYOUT
        processor layout y direction: @JEDI_VAR_GSIYLAYOUT
        debugging mode: false

    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: latlon
          lats: @JEDI_GSIBEC_NLAT
          lons: @JEDI_GSIBEC_NLON
        custom partitioner matching gsi:
          bands: @JEDI_VAR_GSIYLAYOUT
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator

#   saber outer blocks:
#   - saber block name: gsi interpolation to model grid
#     gsi akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
#     gsi error covariance file: ./fv3-jedi/gsibec/gsibec_coefficients_c@JEDI_BKGCOV_RESOL.nc4
#     gsi berror namelist file: ./fv3-jedi/gsibec/cli_gsibec_configuration_c@JEDI_BKGCOV_RESOL.nml
#     processor layout x direction: @JEDI_VAR_GSIXLAYOUT
#     processor layout y direction: @JEDI_VAR_GSIYLAYOUT
#     debugging mode: false

      state variables to inverse:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - geopotential_height_times_gravity_at_surface
      - skin_temperature_at_surface
    linear variable change:
      linear variable change name: Control2Analysis
      input variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - geopotential_height_times_gravity_at_surface
      - skin_temperature_at_surface
      output variables:
      - ua
      - va
      - t
      - q
      - ps
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - frocean
      - frlake
      - frseaice
      - ts
# OBSYAML_BEG
# OBSYAML_END
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry:
      fms initialization:
        namelist filename: ./fv3-jedi/fv3files/fmsmpp.nml
        field table filename: ./fv3-jedi/fv3files/field_table_gmao
      akbk: ./fv3-jedi/fv3files/akbk@JEDI_BKG_VRES.nc4
      layout:
      - @JEDI_VAR_XLAYOUT
      - @JEDI_VAR_YLAYOUT
      npx: @JEDI_BKG_HRES
      npy: @JEDI_BKG_HRES
      npz: @JEDI_BKG_VRES
      field metadata override: ./fv3-jedi/fieldmetadata/geos.yaml
    gradient norm reduction: 1e-3
    ninner: '100'
    linear model:
      name: Identity
      increment variables:
      - ua
      - va
      - t
      - q
      - ps
      - qi
      - ql
      - qr
      - qs
      - o3ppmv
      - phis
      - frocean
      - frlake
      - frseaice
      - ts
      variable change: Identity
      tstep: PT3H
    diagnostics:
      departures: ombg
    online diagnostics:
      write increment: true
      increment:
        state component:
          filetype: auxgrid
          gridtype: latlon
          datapath: ./inc
          filename: $EXPID.jedi_inc1.eta.
final:
  diagnostics:
    departures: oman
  prints:
    frequency: PT3H
output:
  filetype: cube sphere history
  provider: geos
  datapath: ./ana
  filename: $EXPID.jedi_ana.ceta.%yyyy%mm%dd_%hh%MMz.nc4
  first: PT0H
  frequency: PT3H
